name: PWA Worker version regression
# Focused diagnostic / manual reproduction; normal PR coverage uses test inventory.
on:
  push:
    branches: ['fix/pwa-worker-bootstrap-20261119']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pwa-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cached-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-1.62.1-${{ hashFiles('package-lock.json') }}
      - name: Prepare Chromium
        timeout-minutes: 5
        run: |
          for apt_source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if test -f "$apt_source"; then
              sudo sed -i -E 's#http://[a-z0-9.-]+\.ec2\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' "$apt_source"
            fi
          done
          npx playwright install-deps chromium
          npx playwright install chromium
          node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV,"BROWSER_EXECUTABLE="+require("playwright").chromium.executablePath()+"\n")'
      - run: node --test tests/world-map/globalMapClientVersion.test.cjs
      - run: node --test tests/workspace/pwaWorkerVersion.browser.test.cjs
      - run: node --test tests/workspace/pwa.browser.test.cjs
