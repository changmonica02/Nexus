name: Global map editor integration
on:
  pull_request:
    paths:
      - 'src/components/*Map*.tsx'
      - 'src/components/WorldEntityPanel.tsx'
      - 'src/features/worldMap/**'
      - 'src/lib/types.ts'
      - 'experiments/spherical-grid/**'
      - 'tests/globalMap*'
      - 'tests/fixtures/globalMapEditor.jsx'
      - 'tests/worldMap*'
      - 'scripts/build-global-map.mjs'
      - 'package*.json'
      - '.github/workflows/global-map-editor.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: global-map-editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editor:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run map:global
      - run: npx tsc --noEmit
      - run: npx eslint src/components/GlobalMapCanvas.tsx src/components/GlobalMapParameters.tsx src/components/GlobalWorldMapEditor.tsx src/components/WorldMapCreator.tsx src/features/worldMap/globalMap*.ts
      - run: node --test tests/globalMap.test.cjs tests/worldMap.test.cjs tests/worldMapCore.test.cjs tests/worldMapIndexedDB.test.cjs
      - run: npx next build
      - name: Check production worker asset is executable JavaScript
        run: |
          node -e 'const fs=require("fs"),p=".next/static/media/",files=fs.readdirSync(p).filter(n=>n.startsWith("global-map-worker.")&&n.endsWith(".js"));if(!files.length)throw Error("Missing compiled worker");for(const f of files)new (require("vm").Script)(fs.readFileSync(p+f,"utf8"));'
      - run: npx playwright install --with-deps chromium webkit
      - name: WebKit workspace, offline and reconnect
        run: GLOBAL_MAP_BROWSER=webkit node tests/globalMapEditor.browser.test.cjs
      - name: Repeat WebKit from a clean persistent profile
        run: GLOBAL_MAP_BROWSER=webkit node tests/globalMapEditor.browser.test.cjs
      - name: Chromium workspace, offline and reconnect
        run: node tests/globalMapEditor.browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-map-editor-evidence
          path: test-results/global-map/
          if-no-files-found: ignore
