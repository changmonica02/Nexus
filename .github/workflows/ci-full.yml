name: Ready for review full regression (pilot)
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inventory:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node tests/tools/test-groups.mjs --check
      - run: node --test tests/tools/select-fast-tests.test.mjs
      - run: node tests/tools/run-full-extras.mjs --audit

  morpheme-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tests/dictionary/dictionarySenseDerivations.test.cjs && node tests/dictionary/dictionaryExamplesAtomicDraft.test.cjs && node tests/dictionary/dictionarySenseReview.test.cjs && node tests/dictionary/dictionarySenseExchange.test.cjs && node tests/dictionary/dictionaryExchangeB2Scope.test.cjs && node tests/dictionary/dictionaryInflectionsSQLRetirement.test.cjs && node tests/dictionary/dictionarySharedWordContent.test.cjs && node tests/dictionary/dictionarySafeMarkdown.test.cjs && node tests/dictionary/dictionaryStudyBack.test.cjs && node tests/dictionary/dictionarySenseEditor.test.cjs && node tests/dictionary/currentImportBoundary.test.cjs && node tests/dictionary/morphemeContract.test.cjs && node tests/dictionary/morphemeDatabase.test.cjs && node tests/dictionary/morphemeRetirement.test.cjs && node tests/dictionary/maintenanceCleanupRetirement.test.cjs
      - name: Native isolated morphology RPC and transaction tests
        run: |
          docker run --rm -d --name nexus46-morpheme-ci --network none --label nexus.test=pr46-local -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          for attempt in $(seq 1 30); do docker exec nexus46-morpheme-ci pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
          docker exec nexus46-morpheme-ci pg_isready -h 127.0.0.1 -U postgres
          NEXUS_TEST_POSTGRES_CONTAINER=nexus46-morpheme-ci node tests/dictionary/morphemeDatabase.test.cjs
          NEXUS_TEST_POSTGRES_CONTAINER=nexus46-morpheme-ci node tests/dictionary/morphemeRetirement.test.cjs
          NEXUS_TEST_POSTGRES_CONTAINER=nexus46-morpheme-ci node tests/dictionary/maintenanceCleanupRetirement.test.cjs
          NEXUS_TEST_POSTGRES_CONTAINER=nexus46-morpheme-ci node tests/dictionary/dictionaryInflectionsSQLRetirement.test.cjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Select installed Chromium
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "BROWSER_EXECUTABLE=" + require("playwright").chromium.executablePath() + "\n")'
      - run: node tests/dictionary/morphemeEditor.browser.test.cjs
      - run: STUDY_BROWSER=webkit node tests/dictionary/morphemeEditor.browser.test.cjs
      - run: npx tsc --noEmit
      - run: npx eslint src/features/dictionary/MorphemeSenseEditor.tsx src/features/dictionary/MorphemeWordLinks.tsx src/features/dictionary/retiredMorphemeFields.ts src/features/dictionary/DictionaryCatalogNavigation.tsx src/features/dictionary/morphemeLinks.ts src/features/dictionary/catalog.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morpheme-editor-evidence
          path: test-results/morpheme-editor/**/*.png
          if-no-files-found: ignore
      - name: Remove isolated database
        if: always()
        run: docker rm -f nexus46-morpheme-ci || true
  note:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Select installed Chromium
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "BROWSER_EXECUTABLE=" + require("playwright").chromium.executablePath() + "\n")'
      - name: PDF verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils fonts-noto-cjk
      - run: node --test tests/note/lessonDocument.test.cjs tests/note/noteExportLayout.test.cjs tests/note/noteTablePagination.test.cjs
      - run: node tests/note/noteTablePagination.browser.test.cjs
      - name: Export reproduction and regression
        run: node tests/note/noteExport.browser.test.cjs
      - name: Note editor browser regression
        run: node tests/note/noteEditor.browser.test.cjs
      - run: npx eslint src/components/NoteExportPreview.tsx src/lib/noteExportLayout.ts src/lib/noteTablePagination.ts
      - name: Synthetic export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-export-evidence
          path: |
            test-results/note-export
            test-results/note-pagination
          if-no-files-found: ignore


  dictionary-regression:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Select installed Chromium
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "BROWSER_EXECUTABLE=" + require("playwright").chromium.executablePath() + "\n")'
      - name: Dictionary migration compatibility
        run: node tests/dictionary/dictionaryWordSegments.test.cjs
      - name: Dictionary reader, exchange, relationships and approval
        run: node --test tests/dictionary/dictionaryPronunciations.test.cjs tests/dictionary/dictionaryExchange.test.cjs tests/dictionary/dictionaryConnections.test.cjs tests/dictionary/dictionaryApproval.test.cjs tests/dictionary/dictionaryImportApproval.test.cjs tests/dictionary/dictionaryPersistentImport.test.cjs
      - name: Persistent dictionary browser
        run: node tests/dictionary/dictionaryPersistent.browser.test.cjs
      - name: Dictionary exchange and atomic replacement regression
        run: |
          node tests/dictionary/dictionaryTransfer.test.cjs
          node tests/dictionary/dictionaryExchangeSafety.test.cjs
          node tests/dictionary/dictionaryExchange.browser.test.cjs
          node tests/dictionary/dictionaryTransfer.browser.test.cjs
          TRANSFER_BROWSER=webkit node tests/dictionary/dictionaryTransfer.browser.test.cjs
      - name: Native isolated PostgreSQL transfer transaction regression
        run: |
          docker run -d --name nexus46-transfer-ci --label nexus.test=pr46-local --network none -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          trap 'docker rm -f nexus46-transfer-ci' EXIT
          for attempt in $(seq 1 30); do
            if docker exec nexus46-transfer-ci pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          NEXUS_TEST_POSTGRES_CONTAINER=nexus46-transfer-ci node tests/dictionary/dictionaryTransfer.test.cjs
      - name: Dictionary morphology, admin, reader and autosave
        run: |
          node --test tests/dictionary/dictionaryMorphology.test.cjs tests/dictionary/dictionaryAdminUI.test.cjs tests/dictionary/dictionaryReader.test.cjs
          node tests/dictionary/dictionaryAutosave.browser.test.cjs
          node tests/dictionary/dictionaryMorphology.browser.test.cjs
          STUDY_BROWSER=webkit node tests/dictionary/dictionaryMorphology.browser.test.cjs
      - name: Dictionary editor and study-linked dictionary panels
        run: |
          node tests/dictionary/studyDictionaryPanel.browser.test.cjs
          node tests/dictionary/studyDictionaryEditor.browser.test.cjs
          node tests/dictionary/dictionaryEditor.browser.test.cjs
          STUDY_BROWSER=webkit node tests/dictionary/studyDictionaryPanel.browser.test.cjs
      - name: Dictionary lint
        run: npx eslint src/features/dictionary/DictionaryAdmin.tsx src/features/dictionary/DictionaryArticle.tsx src/features/dictionary/WordSegmentsEditor.tsx src/features/dictionary/RelationTargetPicker.tsx src/features/dictionary/reader.ts src/features/dictionary/studyComposition.ts src/components/DataSourcesAndCopyright.tsx src/features/dictionary/DictionaryAI.tsx src/features/dictionary/aiDictionary.ts

  study-regression:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Select installed Chromium
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "BROWSER_EXECUTABLE=" + require("playwright").chromium.executablePath() + "\n")'
      - name: Official content, records and review contracts
        run: node --test tests/study/studyQuizRetirement.test.cjs tests/study/officialLinkedContent.test.cjs tests/study/studyRepository.test.cjs tests/study/studySessions.test.cjs tests/study/studyClear.test.cjs tests/study/officialPrivateIdentity.test.cjs
      - name: Speech, reading and official content browser
        run: |
          node --test tests/study/studySpeech.test.cjs tests/study/studyReading.test.cjs
          node tests/study/officialLinkedContent.browser.test.cjs
          node tests/study/studySpeech.browser.test.cjs
          SPEECH_BROWSER=webkit node tests/study/studySpeech.browser.test.cjs
          node tests/study/studyReading.browser.test.cjs
      - name: Study startup, intervals, styles, synchronization and interface
        run: |
          node --test tests/study/studyStartup.performance.test.cjs tests/study/studyStyles.test.cjs tests/study/studyIntervals.test.cjs tests/study/studySync.test.cjs
          node tests/study/studyStartup.browser.test.cjs
          STUDY_BROWSER=webkit node tests/study/studyStartup.browser.test.cjs
          node tests/study/unifiedStudy.browser.test.cjs
      - name: Study lint
        run: npx eslint src/features/study/StudyRepository.ts src/features/study/officialContent.ts src/features/study/useOfficialContent.ts src/features/study/components/StudySetView.tsx src/features/study/components/ScheduledStudySession.tsx src/features/study/components/StudyCompositionSummary.tsx

  workspace-regression:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Select installed Chromium
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "BROWSER_EXECUTABLE=" + require("playwright").chromium.executablePath() + "\n")'
      - name: Workspace storage, attachments and integration
        run: |
          node --test tests/workspace/workspaceSync.test.cjs
          node tests/workspace/attachmentSync.browser.test.cjs
          node tests/workspace/unifiedWorkspace.browser.test.cjs
          NEXUS_STAGE_A=1 node tests/workspace/unifiedWorkspace.browser.test.cjs
          STUDY_BROWSER=webkit NEXUS_STAGE_A=1 node tests/workspace/unifiedWorkspace.browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-interface-evidence
          path: test-results/interface-a/**/*.png
          if-no-files-found: ignore

  shared-regression:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Shared schema and page compatibility
        run: node --test tests/shared/retirementCompatibility.test.cjs tests/shared/schemaRetirement.test.cjs tests/shared/pageDefaultModeRetirement.test.cjs
      - name: Shared lint and typing
        run: |
          npx tsc --noEmit
          npx eslint src/lib/i18n.ts

  world-map:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Select installed Chromium
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "BROWSER_EXECUTABLE=" + require("playwright").chromium.executablePath() + "\n")'
      - name: Production build
        id: map-build
        env:
          NODE_ENV: production
          NPM_CONFIG_OMIT: dev
        run: npm run build
      - name: Map region and internationalization contracts
        run: node --test tests/world-map/worldMapRegions.test.cjs tests/world-map/worldMap.i18n.test.cjs
      - name: Native project and distribution regression
        run: node tests/world-map/worldMap.browser.test.cjs
      - name: Chromium workspace
        if: ${{ !cancelled() && steps.map-build.outcome == 'success' }}
        run: node tests/world-map/worldMapUI.browser.test.cjs
      - name: WebKit workspace
        if: ${{ !cancelled() && steps.map-build.outcome == 'success' }}
        run: MAP_BROWSER=webkit node tests/world-map/worldMapUI.browser.test.cjs
      - name: Offline PWA
        if: ${{ !cancelled() && steps.map-build.outcome == 'success' }}
        run: node tests/world-map/pwaWorldMap.browser.test.cjs
      - name: Map workspace visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-map-workspace-evidence
          path: test-results/world-map-ui/**/*.png
          if-no-files-found: ignore

  study-b:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Session and visibility regression
        run: node --test tests/study/studyIntervals.test.cjs tests/study/studySessionExit.test.cjs tests/study/studyCardVisibility.test.cjs tests/study/studyCardVisibilityDatabase.test.cjs
      - name: Native isolated PostgreSQL visibility transaction
        run: |
          docker run -d --name nexus46-visibility-ci --label nexus.test=pr46-local --network none -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          trap 'docker rm -f nexus46-visibility-ci' EXIT
          for attempt in $(seq 1 30); do
            if docker exec nexus46-visibility-ci pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          NEXUS_TEST_POSTGRES_CONTAINER=nexus46-visibility-ci node tests/study/studyCardVisibilityDatabase.test.cjs
      - name: Chromium and WebKit offline visibility and backup
        run: |
          export BROWSER_EXECUTABLE=$(node -p 'require("playwright").chromium.executablePath()')
          node tests/study/studyVisibility.browser.test.cjs
          STUDY_BROWSER=webkit node tests/study/studyVisibility.browser.test.cjs
      - name: Production offline PWA and account regression
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://pwa-fixture.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-pwa-public-key
        run: |
          npm run build
          npx next start --hostname 127.0.0.1 --port 32131 > /tmp/nexus-study-pwa.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:32131 >/dev/null; then break; fi
            sleep 1
          done
          export BROWSER_EXECUTABLE=$(node -p 'require("playwright").chromium.executablePath()')
          NEXUS_PWA_URL=http://127.0.0.1:32131 NEXUS_PWA_AUTH_FIXTURE=1 node tests/workspace/pwa.production.browser.test.cjs
          NEXUS_PWA_URL=http://127.0.0.1:32131 node tests/workspace/pwaData.production.browser.test.cjs

  dictionary-c:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Dictionary list identity and pending work regression
        run: node --test tests/dictionary/dictionaryDefects.test.cjs tests/dictionary/dictionaryEntryDeletion.test.cjs
      - name: Isolated PostgreSQL and rollback
        run: |
          docker run -d --name nexus46-dictionary-c --label nexus.test=pr46-local --network none -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          trap 'docker rm -f nexus46-dictionary-c' EXIT
          for attempt in $(seq 1 30); do
            if docker exec nexus46-dictionary-c pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          NEXUS_TEST_POSTGRES_CONTAINER=nexus46-dictionary-c node tests/dictionary/dictionaryDefects.test.cjs
      - name: Chromium and WebKit protected deletion
        run: |
          export BROWSER_EXECUTABLE=$(node -p 'require("playwright").chromium.executablePath()')
          node tests/dictionary/dictionaryEntryDeletion.browser.test.cjs
          STUDY_BROWSER=webkit node tests/dictionary/dictionaryEntryDeletion.browser.test.cjs
      - run: npx eslint src/features/dictionary/DictionaryAdmin.tsx src/features/dictionary/adminNavigation.ts src/features/dictionary/adminQueries.ts src/features/dictionary/deleteEntry.ts src/features/dictionary/morphemeContract.ts src/features/dictionary/readerNavigation.ts src/lib/i18n.ts

  global-editor:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run map:global
      - run: npx tsc --noEmit
      - run: npx eslint src/components/GlobalMapCanvas.tsx src/components/GlobalMapParameters.tsx src/components/GlobalWorldMapEditor.tsx src/components/WorldMapCreator.tsx src/features/worldMap/globalMap*.ts
      - run: node --test tests/world-map/globalMap.test.cjs tests/world-map/worldMap.test.cjs tests/world-map/worldMapCore.test.cjs tests/world-map/worldMapIndexedDB.test.cjs
      - run: npx next build
      - name: Check production worker asset is executable JavaScript
        run: |
          node -e 'const fs=require("fs"),p=".next/static/media/",files=fs.readdirSync(p).filter(n=>n.startsWith("global-map-worker.")&&n.endsWith(".js"));if(!files.length)throw Error("Missing compiled worker");for(const f of files)new (require("vm").Script)(fs.readFileSync(p+f,"utf8"));'
      - run: npx playwright install --with-deps chromium webkit
      - name: WebKit workspace, offline and reconnect
        run: GLOBAL_MAP_BROWSER=webkit node tests/world-map/globalMapEditor.browser.test.cjs
      - name: Chromium workspace, offline and reconnect
        run: node tests/world-map/globalMapEditor.browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-map-editor-evidence
          path: test-results/global-map/
          if-no-files-found: ignore

  additional-regression:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [dictionary, study, world-map, creation, life, workspace, shared]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://pwa-fixture.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-pwa-public-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Additional non-browser tests
        run: node tests/tools/run-full-extras.mjs --group '${{ matrix.group }}' --mode node
      - name: Build production assets for map / PWA browser suites
        if: matrix.group == 'world-map' || matrix.group == 'dictionary' || matrix.group == 'workspace'
        run: npm run build
      - name: Install Chromium for additional browser suites
        run: |
          npx playwright install --with-deps chromium
          node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV,"BROWSER_EXECUTABLE="+require("playwright").chromium.executablePath()+"\n")'
      - name: Start isolated production fixture for dictionary PWA
        if: matrix.group == 'dictionary' || matrix.group == 'workspace'
        run: |
          npx next start --hostname 127.0.0.1 --port 32142 > /tmp/nexus-full-dictionary-pwa.log 2>&1 &
          echo $! > /tmp/nexus-full-dictionary-pwa.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:32142 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexus-full-dictionary-pwa.log
          exit 1
      - name: Additional browser tests
        run: node tests/tools/run-full-extras.mjs --group '${{ matrix.group }}' --mode browser
      - name: Stop isolated production fixture
        if: always() && (matrix.group == 'dictionary' || matrix.group == 'workspace')
        run: |
          if test -f /tmp/nexus-full-dictionary-pwa.pid; then kill "$(cat /tmp/nexus-full-dictionary-pwa.pid)" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-extra-${{ matrix.group }}-evidence
          path: test-results/
          if-no-files-found: ignore
