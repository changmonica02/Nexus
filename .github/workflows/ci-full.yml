name: Ready for review full regression (pilot)
on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: full-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  inventory:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/test-groups.mjs --check
      - run: node --test scripts/select-fast-tests.test.mjs
      - run: node scripts/run-full-extras.mjs --audit

  morpheme-contract:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tests/dictionarySenseDerivations.test.cjs && node tests/dictionaryExamplesAtomicDraft.test.cjs && node tests/dictionarySenseReview.test.cjs && node tests/dictionarySenseExchange.test.cjs && node tests/dictionaryExchangeB2Scope.test.cjs && node tests/dictionaryInflectionsRetirementB.test.cjs && node tests/dictionaryInflectionsSQLRetirement.test.cjs && node tests/dictionarySharedWordContent.test.cjs && node tests/dictionarySafeMarkdown.test.cjs && node tests/dictionaryStudyBack.test.cjs && node tests/dictionarySenseEditor.test.cjs && node tests/currentImportBoundary.test.cjs && node tests/morphemeContract.test.cjs && node tests/morphemeDatabase.test.cjs && node tests/morphemeRetirement.test.cjs && node tests/maintenanceCleanupRetirement.test.cjs
      - name: Native isolated morphology RPC and transaction tests
        run: |
          docker run --rm -d --name nexus46-morpheme-ci --network none --label nexus.test=pr46-local -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          for attempt in $(seq 1 30); do docker exec nexus46-morpheme-ci pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
          docker exec nexus46-morpheme-ci pg_isready -h 127.0.0.1 -U postgres
          NEXUS_TEST_POSTGRES_CONTAINER=nexus46-morpheme-ci node tests/morphemeDatabase.test.cjs
          NEXUS_TEST_POSTGRES_CONTAINER=nexus46-morpheme-ci node tests/morphemeRetirement.test.cjs
          NEXUS_TEST_POSTGRES_CONTAINER=nexus46-morpheme-ci node tests/maintenanceCleanupRetirement.test.cjs
          NEXUS_TEST_POSTGRES_CONTAINER=nexus46-morpheme-ci node tests/dictionaryInflectionsSQLRetirement.test.cjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Select installed Chromium
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "BROWSER_EXECUTABLE=" + require("playwright").chromium.executablePath() + "\n")'
      - run: node tests/morphemeEditor.browser.test.cjs
      - run: STUDY_BROWSER=webkit node tests/morphemeEditor.browser.test.cjs
      - run: npx tsc --noEmit
      - run: npx eslint src/features/dictionary/MorphemeSenseEditor.tsx src/features/dictionary/MorphemeWordLinks.tsx src/features/dictionary/retiredMorphemeFields.ts src/features/dictionary/DictionaryCatalogNavigation.tsx src/features/dictionary/morphemeLinks.ts src/features/dictionary/catalog.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morpheme-editor-evidence
          path: test-results/morpheme-editor/**/*.png
          if-no-files-found: ignore
      - name: Remove isolated database
        if: always()
        run: docker rm -f nexus46-morpheme-ci || true
  note:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Select installed Chromium
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "BROWSER_EXECUTABLE=" + require("playwright").chromium.executablePath() + "\n")'
      - name: PDF verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils fonts-noto-cjk
      - run: node --test tests/note/noteExportLayout.test.cjs tests/note/noteTablePagination.test.cjs
      - run: node tests/note/noteTablePagination.browser.test.cjs
      - name: Export reproduction and regression
        run: node tests/note/noteExport.browser.test.cjs
      - name: Note, attachment and workspace browser regression
        run: |
          node tests/note/noteEditor.browser.test.cjs
          node tests/workspace/attachmentSync.browser.test.cjs
          node tests/workspace/unifiedWorkspace.browser.test.cjs
      - name: Dictionary migration compatibility
        run: node tests/dictionaryWordSegments.test.cjs
      - name: Official content and retired schema regression
        run: |
          node --test tests/shared/retirementCompatibility.test.cjs tests/shared/schemaRetirement.test.cjs tests/shared/pageDefaultModeRetirement.test.cjs tests/study/studyQuizRetirement.test.cjs tests/study/officialLinkedContent.test.cjs tests/dictionaryPronunciations.test.cjs tests/dictionaryExchange.test.cjs tests/study/studyRepository.test.cjs tests/study/studyFSRS.test.cjs tests/study/studySessions.test.cjs tests/study/studyClear.test.cjs tests/study/officialPrivateIdentity.test.cjs tests/dictionaryConnections.test.cjs
          node tests/study/officialLinkedContent.browser.test.cjs
          node tests/dictionaryEditor.browser.test.cjs
      - name: Dictionary approval and mobile speech regression
        run: |
          node --test tests/dictionaryApproval.test.cjs tests/dictionaryImportApproval.test.cjs tests/study/studySpeech.test.cjs tests/study/studyReading.test.cjs tests/dictionaryPersistentImport.test.cjs
          node tests/study/studySpeech.browser.test.cjs
          SPEECH_BROWSER=webkit node tests/study/studySpeech.browser.test.cjs
          node tests/study/studyReading.browser.test.cjs
          node tests/dictionaryPersistent.browser.test.cjs
      - name: Dictionary exchange and atomic replacement regression
        run: |
          node tests/dictionaryTransfer.test.cjs
          node tests/dictionaryExchangeSafety.test.cjs
          node tests/dictionaryExchange.browser.test.cjs
          node tests/dictionaryTransfer.browser.test.cjs
          TRANSFER_BROWSER=webkit node tests/dictionaryTransfer.browser.test.cjs
      - name: Native isolated PostgreSQL transfer transaction regression
        run: |
          docker run -d --name nexus46-transfer-ci --label nexus.test=pr46-local --network none -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          trap 'docker rm -f nexus46-transfer-ci' EXIT
          for attempt in $(seq 1 30); do
            if docker exec nexus46-transfer-ci pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          NEXUS_TEST_POSTGRES_CONTAINER=nexus46-transfer-ci node tests/dictionaryTransfer.test.cjs
      - name: Compact morphology and Session opening regression
        run: |
          node --test tests/dictionaryMorphology.test.cjs tests/study/studyStartup.performance.test.cjs tests/dictionaryAdminUI.test.cjs tests/dictionaryReader.test.cjs tests/study/studyStyles.test.cjs tests/study/studyIntervals.test.cjs tests/study/studySync.test.cjs
          node tests/dictionaryAutosave.browser.test.cjs
          node tests/dictionaryMorphology.browser.test.cjs
          STUDY_BROWSER=webkit node tests/dictionaryMorphology.browser.test.cjs
          node tests/study/studyStartup.browser.test.cjs
          STUDY_BROWSER=webkit node tests/study/studyStartup.browser.test.cjs
          npx eslint src/features/dictionary/DictionaryAdmin.tsx src/features/dictionary/DictionaryArticle.tsx src/features/dictionary/WordSegmentsEditor.tsx src/features/dictionary/RelationTargetPicker.tsx src/features/dictionary/reader.ts src/features/dictionary/studyComposition.ts src/features/study/StudyRepository.ts src/features/study/officialContent.ts src/features/study/useOfficialContent.ts src/features/study/components/StudySetView.tsx src/features/study/components/ScheduledStudySession.tsx src/features/study/components/StudyCompositionSummary.tsx src/lib/i18n.ts src/components/DataSourcesAndCopyright.tsx src/features/dictionary/DictionaryAI.tsx src/features/dictionary/aiDictionary.ts
      - run: node --test tests/workspace/workspaceSync.test.cjs
      - name: Existing map metadata, IDB and localization contracts
        run: |
          npm run test:world-map
          node --test tests/world-map/worldMapRegions.test.cjs tests/world-map/worldMap.i18n.test.cjs
      - run: npx tsc --noEmit
      - run: npx eslint src/components/NoteExportPreview.tsx src/lib/noteExportLayout.ts src/lib/noteTablePagination.ts
      - name: Production build
        env:
          NODE_ENV: production
          NPM_CONFIG_OMIT: dev
        run: npm run build
      - name: Synthetic export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-export-evidence
          path: |
            test-results/note-export
            test-results/note-pagination
          if-no-files-found: ignore


  world-map:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Select installed Chromium
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "BROWSER_EXECUTABLE=" + require("playwright").chromium.executablePath() + "\n")'
      - name: Production build
        id: map-build
        env:
          NODE_ENV: production
          NPM_CONFIG_OMIT: dev
        run: npm run build
      - name: Native project and distribution regression
        run: node tests/world-map/worldMap.browser.test.cjs
      - name: Chromium workspace
        if: ${{ !cancelled() && steps.map-build.outcome == 'success' }}
        run: node tests/world-map/worldMapUI.browser.test.cjs
      - name: WebKit workspace
        if: ${{ !cancelled() && steps.map-build.outcome == 'success' }}
        run: MAP_BROWSER=webkit node tests/world-map/worldMapUI.browser.test.cjs
      - name: Offline PWA
        if: ${{ !cancelled() && steps.map-build.outcome == 'success' }}
        run: node tests/world-map/pwaWorldMap.browser.test.cjs
      - name: Map workspace visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: world-map-workspace-evidence
          path: test-results/world-map-ui/**/*.png
          if-no-files-found: ignore

  interface-a:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Select installed Chromium
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "BROWSER_EXECUTABLE=" + require("playwright").chromium.executablePath() + "\n")'
      - name: Study settings and safe published reader
        run: |
          node tests/study/unifiedStudy.browser.test.cjs
          node tests/studyDictionaryPanel.browser.test.cjs
          node tests/studyDictionaryEditor.browser.test.cjs
          node tests/dictionaryEditor.browser.test.cjs
          NEXUS_STAGE_A=1 node tests/workspace/unifiedWorkspace.browser.test.cjs
      - name: WebKit reader and assistant scope
        run: |
          STUDY_BROWSER=webkit node tests/studyDictionaryPanel.browser.test.cjs
          STUDY_BROWSER=webkit NEXUS_STAGE_A=1 node tests/workspace/unifiedWorkspace.browser.test.cjs
      - name: Interface visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interface-a-evidence
          path: test-results/interface-a/**/*.png
          if-no-files-found: ignore

  study-b:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Session and visibility regression
        run: node --test tests/study/studySessionStability.test.cjs tests/study/studySessionExit.test.cjs tests/study/studyCardVisibility.test.cjs tests/study/studyCardVisibilityDatabase.test.cjs
      - name: Native isolated PostgreSQL visibility transaction
        run: |
          docker run -d --name nexus46-visibility-ci --label nexus.test=pr46-local --network none -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          trap 'docker rm -f nexus46-visibility-ci' EXIT
          for attempt in $(seq 1 30); do
            if docker exec nexus46-visibility-ci pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          NEXUS_TEST_POSTGRES_CONTAINER=nexus46-visibility-ci node tests/study/studyCardVisibilityDatabase.test.cjs
      - name: Chromium and WebKit offline visibility and backup
        run: |
          export BROWSER_EXECUTABLE=$(node -p 'require("playwright").chromium.executablePath()')
          node tests/study/studyVisibility.browser.test.cjs
          STUDY_BROWSER=webkit node tests/study/studyVisibility.browser.test.cjs
      - name: Production offline PWA and account regression
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://pwa-fixture.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-pwa-public-key
        run: |
          npm run build
          npx next start --hostname 127.0.0.1 --port 32131 > /tmp/nexus-study-pwa.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:32131 >/dev/null; then break; fi
            sleep 1
          done
          export BROWSER_EXECUTABLE=$(node -p 'require("playwright").chromium.executablePath()')
          NEXUS_PWA_URL=http://127.0.0.1:32131 NEXUS_PWA_AUTH_FIXTURE=1 node tests/workspace/pwa.production.browser.test.cjs
          NEXUS_PWA_URL=http://127.0.0.1:32131 node tests/workspace/pwaData.production.browser.test.cjs

  dictionary-c:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium webkit
      - name: Dictionary list identity and pending work regression
        run: node --test tests/dictionaryDefects.test.cjs tests/dictionaryEntryDeletion.test.cjs tests/morphemeRetirement.test.cjs
      - name: Isolated PostgreSQL and rollback
        run: |
          docker run -d --name nexus46-dictionary-c --label nexus.test=pr46-local --network none -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          trap 'docker rm -f nexus46-dictionary-c' EXIT
          for attempt in $(seq 1 30); do
            if docker exec nexus46-dictionary-c pg_isready -h 127.0.0.1 -U postgres; then break; fi
            sleep 1
          done
          NEXUS_TEST_POSTGRES_CONTAINER=nexus46-dictionary-c node tests/dictionaryDefects.test.cjs
      - name: Chromium and WebKit protected deletion
        run: |
          export BROWSER_EXECUTABLE=$(node -p 'require("playwright").chromium.executablePath()')
          node tests/dictionaryEntryDeletion.browser.test.cjs
          STUDY_BROWSER=webkit node tests/dictionaryEntryDeletion.browser.test.cjs
      - run: npx eslint src/features/dictionary/DictionaryAdmin.tsx src/features/dictionary/adminNavigation.ts src/features/dictionary/adminQueries.ts src/features/dictionary/deleteEntry.ts src/features/dictionary/morphemeContract.ts src/features/dictionary/readerNavigation.ts src/lib/i18n.ts

  global-editor:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run map:global
      - run: npx tsc --noEmit
      - run: npx eslint src/components/GlobalMapCanvas.tsx src/components/GlobalMapParameters.tsx src/components/GlobalWorldMapEditor.tsx src/components/WorldMapCreator.tsx src/features/worldMap/globalMap*.ts
      - run: node --test tests/world-map/globalMap.test.cjs tests/world-map/worldMap.test.cjs tests/world-map/worldMapCore.test.cjs tests/world-map/worldMapIndexedDB.test.cjs
      - run: npx next build
      - name: Check production worker asset is executable JavaScript
        run: |
          node -e 'const fs=require("fs"),p=".next/static/media/",files=fs.readdirSync(p).filter(n=>n.startsWith("global-map-worker.")&&n.endsWith(".js"));if(!files.length)throw Error("Missing compiled worker");for(const f of files)new (require("vm").Script)(fs.readFileSync(p+f,"utf8"));'
      - run: npx playwright install --with-deps chromium webkit
      - name: WebKit workspace, offline and reconnect
        run: GLOBAL_MAP_BROWSER=webkit node tests/world-map/globalMapEditor.browser.test.cjs
      - name: Repeat WebKit from a clean persistent profile
        run: GLOBAL_MAP_BROWSER=webkit node tests/world-map/globalMapEditor.browser.test.cjs
      - name: Chromium workspace, offline and reconnect
        run: node tests/world-map/globalMapEditor.browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: global-map-editor-evidence
          path: test-results/global-map/
          if-no-files-found: ignore

  spherical-geometry:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check experimental JavaScript module syntax
        run: |
          for source in experiments/spherical-grid/*.mjs; do node --check "$source"; done
      - name: Geometry and ocean / coast checks (no database, no deployment)
        run: node --test experiments/spherical-grid/*.test.mjs
      - name: Bundle offline browser preview
        run: |
          mkdir -p /tmp/nexus-land-preview
          npm exec --yes --package=esbuild@0.28.2 -- esbuild experiments/spherical-grid/preview.js --bundle --format=iife --platform=browser --outfile=/tmp/nexus-preview-bundle.js
          node --check /tmp/nexus-preview-bundle.js
          node experiments/spherical-grid/build-offline-preview.mjs /tmp/nexus-preview-bundle.js /tmp/nexus-land-preview/index.html
          test -s /tmp/nexus-land-preview/index.html
          ! grep -q 'type="module"' /tmp/nexus-land-preview/index.html
          ! grep -q 'src="./preview.js"' /tmp/nexus-land-preview/index.html
      - name: Install isolated browser test tools
        run: |
          npm install --prefix /tmp/nexus-preview-tools --no-package-lock --ignore-scripts playwright@1.62.1
          /tmp/nexus-preview-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Open packaged preview over file protocol (no network)
        env:
          NODE_PATH: /tmp/nexus-preview-tools/node_modules
        run: node experiments/spherical-grid/offline-preview.browser.cjs /tmp/nexus-land-preview/index.html
      - name: Upload standalone offline preview (download ZIP and open index.html)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-global-land-preview
          path: /tmp/nexus-land-preview/
          if-no-files-found: error
          retention-days: 14

  additional-regression:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    needs: inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [dictionary, study, world-map, note, creation, life, workspace, shared]
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://pwa-fixture.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-pwa-public-key
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Additional non-browser tests
        run: node scripts/run-full-extras.mjs --group '${{ matrix.group }}' --mode node
      - name: Build production assets for map / PWA browser suites
        if: matrix.group == 'world-map' || matrix.group == 'dictionary' || matrix.group == 'workspace'
        run: npm run build
      - name: Install Chromium for additional browser suites
        run: |
          npx playwright install --with-deps chromium
          node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV,"BROWSER_EXECUTABLE="+require("playwright").chromium.executablePath()+"\n")'
      - name: Start isolated production fixture for dictionary PWA
        if: matrix.group == 'dictionary' || matrix.group == 'workspace'
        run: |
          npx next start --hostname 127.0.0.1 --port 32142 > /tmp/nexus-full-dictionary-pwa.log 2>&1 &
          echo $! > /tmp/nexus-full-dictionary-pwa.pid
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:32142 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/nexus-full-dictionary-pwa.log
          exit 1
      - name: Additional browser tests
        run: node scripts/run-full-extras.mjs --group '${{ matrix.group }}' --mode browser
      - name: Stop isolated production fixture
        if: always() && (matrix.group == 'dictionary' || matrix.group == 'workspace')
        run: |
          if test -f /tmp/nexus-full-dictionary-pwa.pid; then kill "$(cat /tmp/nexus-full-dictionary-pwa.pid)" || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-extra-${{ matrix.group }}-evidence
          path: test-results/
          if-no-files-found: ignore
