name: Manual performance and large-dataset checks
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Performance suite to run'
        required: true
        type: choice
        options:
          - all
          - dictionary
          - study
          - spherical-grid
        default: all
permissions:
  contents: read
concurrency:
  group: performance-${{ github.ref }}-${{ inputs.suite }}
  cancel-in-progress: true
jobs:
  dictionary:
    if: inputs.suite == 'all' || inputs.suite == 'dictionary'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXUS_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Large dictionary exchange and persistent recovery
        run: |
          node tests/dictionary/dictionaryExchangeScale.test.cjs
          node tests/dictionary/dictionaryPersistentScale.test.cjs
          node tests/dictionary/dictionaryRankedComponents.test.cjs

  study:
    if: inputs.suite == 'all' || inputs.suite == 'study'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Study startup large-dataset benchmark
        run: node --test tests/study/studyStartup.performance.test.cjs

  spherical-grid:
    if: inputs.suite == 'all' || inputs.suite == 'spherical-grid'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Spherical grid reproducible benchmarks
        run: |
          node --expose-gc experiments/spherical-grid/benchmark.mjs
          node --expose-gc experiments/spherical-grid/edit-benchmark.mjs
          node --expose-gc experiments/spherical-grid/pack-update-benchmark.mjs
          node --expose-gc experiments/spherical-grid/coast-index-benchmark.mjs
          node --expose-gc experiments/spherical-grid/indexed-terrain-benchmark.mjs
          node --expose-gc experiments/spherical-grid/pack-incremental-benchmark.mjs
          node --expose-gc experiments/spherical-grid/pack-shrink-benchmark.mjs
          node --expose-gc experiments/spherical-grid/pack-middle-replay-benchmark.mjs
