name: Note editor audit
on:
  push:
    branches: [feat/note-export-audit-20261024]
    paths-ignore: ['docs/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: note-editor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  note:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Export reproduction and regression
        run: node tests/noteExport.browser.test.cjs
      - name: Note, attachment and workspace browser regression
        run: |
          node tests/noteEditor.browser.test.cjs
          node tests/attachmentSync.browser.test.cjs
          node tests/unifiedWorkspace.browser.test.cjs
      - run: node --test tests/workspaceSync.test.cjs
      - run: npx tsc --noEmit
      - run: npx eslint src/components/NoteExportPreview.tsx
      - name: Production build
        env:
          NODE_ENV: production
          NPM_CONFIG_OMIT: dev
        run: npm run build
      - name: Synthetic export evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-export-evidence
          path: test-results/note-export
          if-no-files-found: ignore
