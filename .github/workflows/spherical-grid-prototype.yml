name: Spherical Grid-Pack Prototype
on:
  pull_request:
    paths:
      - 'experiments/spherical-grid/**'
      - '.github/workflows/spherical-grid-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check experimental JavaScript module syntax
        run: |
          for source in experiments/spherical-grid/*.mjs; do node --check "$source"; done
      - name: Geometry and ocean / coast checks (no database, no deployment)
        run: node --test experiments/spherical-grid/*.test.mjs
      - name: Reproducible experimental benchmarks
        run: |
          node --expose-gc experiments/spherical-grid/benchmark.mjs
          node --expose-gc experiments/spherical-grid/edit-benchmark.mjs
          node --expose-gc experiments/spherical-grid/pack-update-benchmark.mjs
          node --expose-gc experiments/spherical-grid/coast-index-benchmark.mjs
          node --expose-gc experiments/spherical-grid/indexed-terrain-benchmark.mjs
          node --expose-gc experiments/spherical-grid/pack-incremental-benchmark.mjs
          node --expose-gc experiments/spherical-grid/pack-shrink-benchmark.mjs
          node --expose-gc experiments/spherical-grid/pack-middle-replay-benchmark.mjs
      - name: Bundle offline browser preview
        run: |
          mkdir -p /tmp/nexus-land-preview
          npm exec --yes --package=esbuild@0.28.2 -- esbuild experiments/spherical-grid/preview.js --bundle --format=iife --platform=browser --outfile=/tmp/nexus-preview-bundle.js
          node --check /tmp/nexus-preview-bundle.js
          node experiments/spherical-grid/build-offline-preview.mjs /tmp/nexus-preview-bundle.js /tmp/nexus-land-preview/index.html
          test -s /tmp/nexus-land-preview/index.html
          ! grep -q 'type="module"' /tmp/nexus-land-preview/index.html
          ! grep -q 'src="./preview.js"' /tmp/nexus-land-preview/index.html
      - name: Upload standalone offline preview (download ZIP and open index.html)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-global-land-preview
          path: /tmp/nexus-land-preview/
          if-no-files-found: error
          retention-days: 14
