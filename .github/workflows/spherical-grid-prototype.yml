name: Spherical Grid-Pack Prototype
on:
  pull_request:
    types: [opened, synchronize, reopened, converted_to_draft]
    paths:
      - 'experiments/spherical-grid/**'
      - 'src/features/worldMap/**'
      - 'src/components/Global*.tsx'
      - 'src/components/WorldMapCreator.tsx'
      - 'tests/world-map/**'
      - 'tests/fixtures/globalMapCreator.jsx'
      - 'scripts/build-global-map.mjs'
      - 'scripts/build-azgaar-command-tools.mjs'
      - 'vendor/azgaar/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/spherical-grid-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-geometry:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked dependencies and prepare native Azgaar commands
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-azgaar-command-tools.mjs
      - name: Check experimental JavaScript module syntax
        run: |
          for source in experiments/spherical-grid/*.mjs; do node --check "$source"; done
      - name: Geometry and ocean / coast checks (no database, no deployment)
        run: node --test experiments/spherical-grid/*.test.mjs
      - name: Global application worker and persistence for draft or manual runs
        if: github.event_name != 'pull_request' || github.event.pull_request.draft || github.base_ref != 'main'
        run: |
          npm run map:global
          node --test tests/world-map/globalMap.test.cjs
          node --test --test-concurrency=1 tests/world-map/globalMapDisplay.test.cjs tests/world-map/globalMapWorkspace.ui.test.cjs tests/world-map/heightBrushWorker.test.cjs tests/world-map/humanGeography.test.cjs tests/world-map/riverSession.test.cjs
      - name: Bundle offline browser preview
        run: |
          mkdir -p /tmp/nexus-land-preview
          npm exec --yes --package=esbuild@0.28.2 -- esbuild experiments/spherical-grid/preview.js --bundle --format=iife --platform=browser --outfile=/tmp/nexus-preview-bundle.js
          node --check /tmp/nexus-preview-bundle.js
          node experiments/spherical-grid/build-offline-preview.mjs /tmp/nexus-preview-bundle.js /tmp/nexus-land-preview/index.html
          test -s /tmp/nexus-land-preview/index.html
          ! grep -q 'type="module"' /tmp/nexus-land-preview/index.html
          ! grep -q 'src="./preview.js"' /tmp/nexus-land-preview/index.html
      - name: Install isolated browser test tools
        run: |
          # Keep signing keys and security sources; normalize the EC2 mirror in all runner formats.
          for apt_source in /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if test -f "$apt_source"; then
              sudo sed -i -E 's#http://[a-z0-9.-]+\.ec2\.archive\.ubuntu\.com/ubuntu/?#http://archive.ubuntu.com/ubuntu/#g' "$apt_source"
            fi
          done
          npx --no-install playwright install --with-deps chromium
      - name: Global creator and editor browser regression for draft or manual runs
        if: github.event_name != 'pull_request' || github.event.pull_request.draft || github.base_ref != 'main'
        run: |
          export BROWSER_EXECUTABLE=$(node -p 'require("playwright").chromium.executablePath()')
          node tests/world-map/globalMapCreator.browser.test.cjs
          node tests/world-map/globalMapSession.browser.test.cjs
      - name: Open packaged preview over file protocol (no network)
        run: node experiments/spherical-grid/offline-preview.browser.cjs /tmp/nexus-land-preview/index.html
      - name: Upload standalone offline preview (download ZIP and open index.html)
        uses: actions/upload-artifact@v4
        with:
          name: nexus-global-land-preview
          path: /tmp/nexus-land-preview/
          if-no-files-found: error
          retention-days: 14
