name: Nexus stage 3A six bathymetry previews
on:
  workflow_dispatch:
  push:
    branches: [feat/azgaar-spherical-templates-20261118]
    paths:
      - experiments/spherical-grid/trigger-stage3a-preview.txt

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate continents, islands and stage-3A bathymetry
        run: node --test experiments/spherical-grid/continent-layout-v2.test.mjs experiments/spherical-grid/island-layout-v2.test.mjs experiments/spherical-grid/simplified-seafloor-v2.test.mjs
      - name: Render 2 ocean, 2 earthlike and 2 land worlds
        run: node experiments/spherical-grid/render-simplified-worlds.mjs --out artifacts/stage3a --width 1200 --height 600
      - uses: actions/upload-artifact@v4
        with:
          name: nexus-stage3a-six-real-bathymetry-maps
          path: artifacts/stage3a/
          if-no-files-found: error
          retention-days: 14
