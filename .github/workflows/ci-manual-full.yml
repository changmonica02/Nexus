name: Manual full morphology and workspace regression
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manual-morphology-workspace-${{ github.ref }}
  cancel-in-progress: true
jobs:
  production-fixture-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://pwa-fixture.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-pwa-public-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build production PWA fixture once
        run: npm run build
      - name: Publish production assets for isolated browser jobs
        uses: actions/upload-artifact@v4
        with:
          name: nexus-production-fixture
          path: |
            .next/
            public/world-map/core/
            public/world-map/offline.js
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  morpheme-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node tests/dictionary/dictionarySenseDerivations.test.cjs && node tests/dictionary/dictionaryExamplesAtomicDraft.test.cjs && node tests/dictionary/dictionarySenseReview.test.cjs && node tests/dictionary/dictionarySenseExchange.test.cjs && node tests/dictionary/dictionaryExchangeB2Scope.test.cjs && node tests/dictionary/dictionarySharedWordContent.test.cjs && node tests/dictionary/dictionarySafeMarkdown.test.cjs && node tests/dictionary/dictionaryStudyBack.test.cjs && node tests/dictionary/dictionarySenseEditor.test.cjs && node tests/dictionary/currentImportBoundary.test.cjs && node tests/dictionary/morphemeContract.test.cjs && node tests/dictionary/morphemeDatabase.test.cjs
      - name: Native isolated morphology RPC and transaction tests
        run: |
          docker run --rm -d --name nexus46-morpheme-ci --network none --label nexus.test=pr46-local -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          for attempt in $(seq 1 30); do docker exec nexus46-morpheme-ci pg_isready -h 127.0.0.1 -U postgres && break; sleep 1; done
          docker exec nexus46-morpheme-ci pg_isready -h 127.0.0.1 -U postgres
          NEXUS_TEST_POSTGRES_CONTAINER=nexus46-morpheme-ci node tests/dictionary/morphemeDatabase.test.cjs
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-webkit-1.62.1-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser dependencies and browsers (8 minute limit)
        timeout-minutes: 8
        run: |
          npx playwright install-deps chromium webkit
          npx playwright install chromium webkit
      - name: Select installed Chromium
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "BROWSER_EXECUTABLE=" + require("playwright").chromium.executablePath() + "\n")'
      - run: node tests/dictionary/morphemeEditor.browser.test.cjs
      - run: STUDY_BROWSER=webkit node tests/dictionary/morphemeEditor.browser.test.cjs
      - run: npx eslint src/features/dictionary/MorphemeSenseEditor.tsx src/features/dictionary/MorphemeWordLinks.tsx src/features/dictionary/retiredMorphemeFields.ts src/features/dictionary/DictionaryCatalogNavigation.tsx src/features/dictionary/morphemeLinks.ts src/features/dictionary/catalog.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: morpheme-editor-evidence
          path: test-results/morpheme-editor/**/*.png
          if-no-files-found: ignore
      - name: Remove isolated database
        if: always()
        run: docker rm -f nexus46-morpheme-ci || true
  workspace-regression:
    needs: production-fixture-build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Restore production PWA fixture
        uses: actions/download-artifact@v4
        with:
          name: nexus-production-fixture
          path: .
      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-chromium-webkit-1.62.1-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browser dependencies and browsers (8 minute limit)
        timeout-minutes: 8
        run: |
          npx playwright install-deps chromium webkit
          npx playwright install chromium webkit
      - name: Select installed Chromium
        run: node -e 'require("fs").appendFileSync(process.env.GITHUB_ENV, "BROWSER_EXECUTABLE=" + require("playwright").chromium.executablePath() + "\n")'
      - name: Workspace storage, attachments and integration
        run: |
          node --test tests/workspace/workspaceSync.test.cjs
          node tests/workspace/attachmentSync.browser.test.cjs
          node tests/workspace/unifiedWorkspace.browser.test.cjs
          NEXUS_STAGE_A=1 NEXUS_VIEWPORT_PROFILE=stage-a node tests/workspace/unifiedWorkspace.browser.test.cjs
          STUDY_BROWSER=webkit NEXUS_STAGE_A=1 NEXUS_VIEWPORT_PROFILE=stage-a-webkit node tests/workspace/unifiedWorkspace.browser.test.cjs
      - name: Production offline PWA and account regression
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://pwa-fixture.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-pwa-public-key
        run: |
          npx next start --hostname 127.0.0.1 --port 32131 > /tmp/nexus-study-pwa.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:32131 >/dev/null; then break; fi
            sleep 1
          done
          export BROWSER_EXECUTABLE=$(node -p 'require("playwright").chromium.executablePath()')
          NEXUS_PWA_URL=http://127.0.0.1:32131 NEXUS_PWA_AUTH_FIXTURE=1 node tests/workspace/pwa.production.browser.test.cjs
          NEXUS_PWA_URL=http://127.0.0.1:32131 node tests/workspace/pwaData.production.browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-interface-evidence
          path: test-results/interface-a/**/*.png
          if-no-files-found: ignore
